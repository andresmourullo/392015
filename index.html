
<!DOCTYPE html>

  <script>
    const preguntas = [{"pregunta": "1.      A los efectos previstos en esta Ley, tendrán capacidad de obrar ante las Administraciones Públicas (señala la incorrecta):", "opciones": ["las personas físicas o jurídicas que ostenten capacidad de obrar con arreglo a las normas civiles", "los menores de edad no incapacitados para el ejercicio y defensa de aquellos de sus derechos e intereses cuya actuación está permitida por el ordenamiento jurídico sin la asistencia de la persona que ejerza la patria potestad, tutela o curatela", "los menores incapacitados, cuando la extensión de la incapacitación afecte al ejercicio y defensa de los derechos o intereses de que se trate", "cuando la Ley así lo declare expresamente, los grupos de afectados, las uniones y entidades sin personalidad jurídica y los patrimonios independientes o autónomos"], "correcta": "los menores incapacitados, cuando la extensión de la incapacitación afecte al ejercicio y defensa de los derechos o intereses de que se trate"}, {"pregunta": "2.      Se consideran interesados en el procedimiento administrativo (señala la incorrecta):", "opciones": ["quienes lo promuevan como titulares de derechos o intereses legítimos individuales", "quienes lo promuevan como titulares de derechos o intereses legítimos colectivos", "los que, sin haber iniciado el procedimiento, tengan derechos que puedan resultar afectados por la decisión que en el mismo se adopte", "aquellos cuyos intereses legítimos, individuales o colectivos, puedan resultar afectados por la resolución siempre que se personen en el procedimiento durante el trámite de audiencia"], "correcta": "aquellos cuyos intereses legítimos, individuales o colectivos, puedan resultar afectados por la resolución siempre que se personen en el procedimiento durante el trámite de audiencia"}, {"pregunta": "3.      Las asociaciones y organizaciones representativas de intereses económicos y sociales:", "opciones": ["serán titulares de intereses legítimos individuales y colectivos en los términos que reglamentariamente se establezca", "serán titulares de intereses legítimos individuales y colectivos", "no serán titulares de intereses legítimos colectivos", "serán titulares de intereses legítimos colectivos en los términos que la Ley reconozca"], "correcta": "serán titulares de intereses legítimos colectivos en los términos que la Ley reconozca"}, {"pregunta": "5.      Los menores incapacitados, cuando la extensión de la incapacitación afecte al ejercicio y defensa de los derechos o intereses de que se trate:", "opciones": ["tienen capacidad de obrar limitada", "pueden actuar sin la asistencia de la persona que ejerza la patria potestad, tutela o curatela", "no tienen capacidad de obrar", "ninguna es correcta"], "correcta": "no tienen capacidad de obrar"}, {"pregunta": "6.      Los interesados con capacidad de obrar podrán actuar por medio de representante:", "opciones": ["entendiéndose con éste las actuaciones administrativas, salvo manifestación expresa o tácita en contra del interesado", "entendiéndose con el interesado las actuaciones administrativas, salvo manifestación expresa en contra del interesado", "entendiéndose con éste las actuaciones administrativas, salvo manifestación expresa en contra del interesado", "entendiéndose con el interesado las actuaciones administrativas, salvo manifestación expresa o tácita en contra del interesado"], "correcta": "entendiéndose con éste las actuaciones administrativas, salvo manifestación expresa en contra del interesado"}, {"pregunta": "7.      Podrán actuar en representación de otras ante las Administraciones Públicas:", "opciones": ["las personas físicas con o sin capacidad de obrar y las personas jurídicas, aunque no está previsto en sus Estatutos", "las personas físicas con capacidad de obrar y las personas jurídicas, aunque no está previsto en sus Estatutos", "las personas físicas con o sin capacidad de obrar y las personas jurídicas, siempre que ello esté previsto en sus Estatutos", "las personas físicas con capacidad de obrar y las personas jurídicas, siempre que ello esté previsto en sus Estatutos"], "correcta": "las personas físicas con capacidad de obrar y las personas jurídicas, siempre que ello esté previsto en sus Estatutos"}, {"pregunta": "8.      Se presumirá la representación para:", "opciones": ["formular solicitudes", "los actos y gestiones de mero trámite", "presentar declaraciones responsables o comunicaciones", "interponer recursos, desistir de acciones y renunciar a derechos en nombre de otra persona"], "correcta": "los actos y gestiones de mero trámite"}, {"pregunta": "9.      La representación podrá acreditarse:", "opciones": ["mediante cualquier título jurídico", "mediante resolución judicial especial", "únicamente mediante poder notarial", "mediante cualquier medio válido en Derecho que deje constancia fidedigna de su existencia"], "correcta": "mediante cualquier medio válido en Derecho que deje constancia fidedigna de su existencia"}, {"pregunta": "10.      Se entenderá acreditada la representación realizada:", "opciones": ["mediante apoderamiento apud acta efectuado por comparecencia personal", "mediante apoderamiento apud acta efectuado por comparecencia electrónica en la correspondiente sede electrónica", "a través de la acreditación de su inscripción en el registro electrónico de apoderamientos de la Administración Pública competente", "todas son correctas"], "correcta": "todas son correctas"}, {"pregunta": "11.      Deberá incorporar al expediente administrativo acreditación de la condición de representante y de los poderes que tiene reconocidos en dicho momento:", "opciones": ["el órgano competente para la iniciación del procedimiento", "el órgano competente para la instrucción del procedimiento", "el órgano competente para la tramitación del procedimiento", "el órgano competente para la terminación del procedimiento"], "correcta": "el órgano competente para la tramitación del procedimiento"}, {"pregunta": "12.      La falta o insuficiente acreditación de la representación no impedirá que se tenga por realizado el acto de que se trate, siempre que se aporte aquella o se subsane el defecto dentro del plazo de:", "opciones": ["5 días o de un plazo superior cuando las circunstancias del caso así lo requieran", "10 días o de un plazo superior cuando las circunstancias del caso así lo requieran", "15 días o de un plazo superior cuando las circunstancias del caso así lo requieran", "20 días o de un plazo superior cuando las circunstancias del caso así lo requieran"], "correcta": "10 días o de un plazo superior cuando las circunstancias del caso así lo requieran"}, {"pregunta": "13.      Las Administraciones Públicas podrán habilitar:", "opciones": ["con carácter general a personas jurídicas autorizadas para la realización de determinadas transacciones electrónicas en representación de los interesados", "con carácter general o específico a personas jurídicas autorizadas para la realización de determinadas transacciones electrónicas en representación de los interesados", "con carácter general o específico a personas físicas o jurídicas autorizadas para la realización de determinadas transacciones electrónicas en representación de los interesados", "con carácter general a personas físicas o jurídicas autorizadas para la realización de determinadas transacciones electrónicas en representación de los interesados"], "correcta": "con carácter general o específico a personas físicas o jurídicas autorizadas para la realización de determinadas transacciones electrónicas en representación de los interesados"}, {"pregunta": "14.      Dispondrá/n de un registro electrónico general de apoderamientos:", "opciones": ["la Administración General del Estado", "las Administraciones de las Comunidades Autónomas", "las Entidades Locales", "todas son correctas"], "correcta": "todas son correctas"}, {"pregunta": "15.      En el registro electrónico general de apoderamientos, deberán inscribirse, al menos, los de carácter general otorgados por quien ostente la condición de interesado en un procedimiento administrativo a favor de representante:", "opciones": ["apud acta", "presencialmente", "electrónicamente", "todas son correctas"], "correcta": "todas son correctas"}, {"pregunta": "16.      Respecto a los registros electrónicos de apoderamientos no es correcto:", "opciones": ["en el ámbito estatal, este registro será el Registro Electrónico de Apoderamientos de la Administración General del Estado", "en ellos no constará el bastanteo realizado del poder", "los registros generales de apoderamientos no impedirán la existencia de registros particulares en cada Organismo", "cada Organismo podrá disponer de su propio registro electrónico de apoderamientos"], "correcta": "en ellos no constará el bastanteo realizado del poder"}, {"pregunta": "17.      Será/n interoperable/s con los registros electrónicos generales y particulares de apoderamientos:", "opciones": ["los registros mercantiles", "los registros de la propiedad", "los protocolos notariales", "todas son correctas"], "correcta": "todas son correctas"}, {"pregunta": "18.      Los asientos que se realicen en los registros electrónicos generales y particulares de apoderamientos deberán contener, al menos: (señala la incorrecta)", "opciones": ["nombre y apellidos o la denominación o razón social, documento nacional de identidad, número de identificación fiscal o documento equivalente del poderdante y del apoderado", "causas de anulación del apoderamiento", "período de tiempo por el cual se otorga el poder", "tipo de poder según las facultades que otorgue"], "correcta": "causas de anulación del apoderamiento"}, {"pregunta": "19.      Respecto a los poderes que se inscriban en los registros electrónicos generales y particulares de apoderamientos pueden ser:", "opciones": ["un poder general para que el apoderado pueda actuar en nombre del poderdante en cualquier actuación administrativa y ante cualquier Administración", "un poder para que el apoderado pueda actuar en nombre del poderdante en cualquier actuación administrativa ante una Administración u Organismo concreto", "un poder para que el apoderado pueda actuar en nombre del poderdante únicamente para la realización de determinados trámites especificados en el poder", "todas son correctas"], "correcta": "todas son correctas"}, {"pregunta": "20.      Señala la correcta:", "opciones": ["la falta o insuficiente acreditación de la representación impedirá que se tenga por realizado el acto de que se trate", "el documento electrónico que acredite el resultado de la consulta al registro electrónico de apoderamientos correspondiente tendrá la condición de acreditación a estos efectos", "los registros electrónicos generales y particulares de apoderamientos pertenecientes a todas y cada una de las Administraciones, serán preferiblemente interoperables entre sí", "el interesado no podrá comparecer por sí mismo en un procedimiento en el que haya designado representante"], "correcta": "el documento electrónico que acredite el resultado de la consulta al registro electrónico de apoderamientos correspondiente tendrá la condición de acreditación a estos efectos"}, {"pregunta": "1.      Los registros mercantiles, de la propiedad, y de los protocolos notariales serán interoperables con:", "opciones": ["los registros electrónicos generales de apoderamientos", "los registros electrónicos particulares de apoderamientos", "a y b son correctas", "ninguna es correcta"], "correcta": "a y b son correctas"}, {"pregunta": "2.      Los modelos de poderes inscribibles en el registro cuando se circunscriba a actuaciones de la Administración de una Comunidad Autónoma:", "opciones": ["serán aprobados por cada Comunidad Autónoma", "serán los mismos de la Administración del Estado", "serán los que proponga el propio interesado", "serán aprobados por el Gobierno del Estado"], "correcta": "serán aprobados por cada Comunidad Autónoma"}, {"pregunta": "3.      El apoderamiento «apud acta» se otorgará:", "opciones": ["mediante comparecencia electrónica en la correspondiente sede electrónica haciendo uso de los sistemas de firma electrónica previstos en esta Ley o mediante comparecencia personal en las oficinas de asistencia en materia de registros", "mediante comparecencia electrónica en la correspondiente sede electrónica haciendo uso de los sistemas de firma electrónica previstos en esta Ley o mediante comparecencia postal en las oficinas de asistencia en materia de registros", "mediante comparecencia personal en las oficinas de asistencia en materia de registros o mediante comparecencia postal en las oficinas de asistencia en materia de registros", "ninguna es correcta"], "correcta": "mediante comparecencia electrónica en la correspondiente sede electrónica haciendo uso de los sistemas de firma electrónica previstos en esta Ley o mediante comparecencia personal en las oficinas de asistencia en materia de registros"}, {"pregunta": "4.      Los poderes inscritos en el registro tendrán una validez determinada:", "opciones": ["mínima de 5 años a contar desde la fecha de inscripción", "máxima de 10 años a contar desde la fecha de inscripción", "máxima de 5 años a contar desde la fecha de inscripción", "mínima de 10 años a contar desde la fecha de inscripción"], "correcta": "máxima de 5 años a contar desde la fecha de inscripción"}, {"pregunta": "5.      Podrá revocar o prorrogar el poder:", "opciones": ["el poderdante en cualquier momento antes de la finalización del plazo de validez del poder", "el apoderado una vez finalizado el plazo de validez del poder", "el apoderado en cualquier momento antes de la finalización del plazo de validez del poder", "el poderdante una vez finalizado el plazo de validez del poder"], "correcta": "el poderdante en cualquier momento antes de la finalización del plazo de validez del poder"}, {"pregunta": "6.      Las prórrogas otorgadas por el poderdante al registro tendrán una validez determinada:", "opciones": ["máxima de 1 año a contar desde la fecha de inscripción", "máxima de 2 años a contar desde la fecha de inscripción", "máxima de 5 años a contar desde la fecha de inscripción", "máxima de 10 años a contar desde la fecha de inscripción"], "correcta": "máxima de 5 años a contar desde la fecha de inscripción"}, {"pregunta": "7.      Las solicitudes de inscripción del poder, de revocación, de prórroga o de denuncia del mismo:", "opciones": ["deberán dirigirse al registro de la Administración u Organismo ante la que tenga efectos el poder donde quedará inscrita esta circunstancia", "podrán dirigirse a cualquier registro, debiendo quedar inscrita esta circunstancia en el registro de la Administración u Organismo ante la que tenga efectos el poder", "podrán dirigirse a cualquier registro en el que quedará inscrita esta circunstancia", "deberán dirigirse al registro de la Administración u Organismo ante la que tenga efectos el poder y quedará inscrita esta circunstancia en cualquier registro"], "correcta": "podrán dirigirse a cualquier registro, debiendo quedar inscrita esta circunstancia en el registro de la Administración u Organismo ante la que tenga efectos el poder"}, {"pregunta": "8.      Las solicitudes de inscripción del poder, de revocación, de prórroga o de denuncia del mismo surtirán efecto:", "opciones": ["desde la fecha en la que se produzca dicha inscripción", "desde la fecha que se indique en dicha inscripción", "un mes posterior a la fecha en la que se produzca dicha inscripción", "ninguna es correcta"], "correcta": "desde la fecha en la que se produzca dicha inscripción"}, {"pregunta": "9.      Cuando en una solicitud, escrito o comunicación figuren varios interesados, las actuaciones a que den lugar se efectuarán:", "opciones": ["con el representante o el interesado que expresamente hayan señalado, y, en su defecto, con el que figure en primer término", "con el que figure en primer término, y, en su defecto, con el representante o el interesado que expresamente hayan señalado", "con el representante o el interesado que expresamente hayan señalado, y, en su defecto, con todos ellos", "con todos ellos, y, en su defecto, con el representante o el interesado que expresamente hayan señalado"], "correcta": "con el representante o el interesado que expresamente hayan señalado, y, en su defecto, con el que figure en primer término"}, {"pregunta": "10.      Si durante la instrucción de un procedimiento que no haya tenido publicidad, se advierte la existencia de personas que sean titulares de derechos o intereses legítimos y directos cuya identificación resulte del expediente y que puedan resultar afectados por la resolución que se dicte:", "opciones": ["se paralizará el procedimiento hasta que se solucione esta circunstancia", "no serán considerados interesados si no se personan en el procedimiento en plazo de 5 días", "se entenderá que el procedimiento es anulable por defecto de forma", "se comunicará a dichas personas la tramitación del procedimiento"], "correcta": "se comunicará a dichas personas la tramitación del procedimiento"}, {"pregunta": "11.      Las Administraciones Públicas están obligadas a verificar la identidad de los interesados en el procedimiento administrativo, mediante la comprobación de su nombre y apellidos o denominación o razón social, según corresponda, que consten en:", "opciones": ["el correspondiente registro administrativo", "los archivos electrónicos de la Administración", "el Documento Nacional de Identidad o documento identificativo equivalente", "los documentos presentados por las partes"], "correcta": "el Documento Nacional de Identidad o documento identificativo equivalente"}, {"pregunta": "12.      Los interesados podrán identificarse electrónicamente ante las Administraciones Públicas a través de:", "opciones": ["sistemas basados en certificados electrónicos cualificados de firma electrónica expedidos por prestadores incluidos en la ''Lista de confianza de prestadores de servicios de certificación''", "sistemas basados en certificados electrónicos cualificados de sello electrónico expedidos por prestadores incluidos en la ''Lista de confianza de prestadores de servicios de certificación''", "cualquier otro sistema, que las Administraciones consideren válido en los términos y condiciones que se establezca, siempre que cuenten con un registro previo como usuario que permita garantizar su identidad", "todas son correctas"], "correcta": "todas son correctas"}, {"pregunta": "13.      Los interesados podrán firmar a través de cualquier medio que permita acreditar:", "opciones": ["la autenticidad de la expresión de su voluntad y consentimiento", "la integridad del documento", "la inalterabilidad del documento", "todas son correctas"], "correcta": "todas son correctas"}, {"pregunta": "14.      En el caso de que los interesados optaran por relacionarse con las Administraciones Públicas a través de medios electrónicos, se considerará válido a efectos de firma:", "opciones": ["sistemas de firma electrónica cualificada y avanzada basados en certificados electrónicos cualificados de firma electrónica expedidos por prestadores incluidos en la ''Lista de confianza de prestadores de servicios de certificación''", "sistemas de sello electrónico cualificado y de sello electrónico avanzado basados en certificados electrónicos cualificados de sello electrónico expedidos por prestador incluido en la ''Lista de confianza de prestadores de servicios de certificación''", "cualquier otro sistema que las Administraciones Públicas consideren válido en los términos y condiciones que se establezca, siempre que cuenten con un registro previo como usuario que permita garantizar su identidad", "todas son correctas"], "correcta": "todas son correctas"}, {"pregunta": "15.       Las Administraciones Públicas requerirán a los interesados el uso obligatorio de firma para: (señala la incorrecta)", "opciones": ["formular solicitudes", "presentar comunicaciones", "gestiones de mero trámite", "presentar declaraciones responsables"], "correcta": "gestiones de mero trámite"}, {"pregunta": "16.      Mantendrá/n actualizado un registro, u otro sistema equivalente, donde constarán los funcionarios habilitados para la identificación o firma electrónica:", "opciones": ["la Administración General del Estado", "la Administración General del Estado y las Comunidades Autónomas", "las Comunidades Autónomas y las Entidades Locales", "la Administración General del Estado, las Comunidades Autónomas y las Entidades Locales"], "correcta": "la Administración General del Estado, las Comunidades Autónomas y las Entidades Locales"}, {"pregunta": "17.      Cuando así lo disponga expresamente la normativa reguladora aplicable, las Administraciones Públicas podrán admitir los sistemas de identificación contemplados en esta Ley como sistema de firma:", "opciones": ["aún cuando no permitan acreditar la autenticidad de la expresión de la voluntad ni el consentimiento de los interesados", "cuando permitan acreditar la autenticidad de la expresión de la voluntad y consentimiento de los interesados", "aún cuando no permitan acreditar la autenticidad de la expresión de la voluntad pero sí el consentimiento de los interesados", "ninguna es correcta"], "correcta": "cuando permitan acreditar la autenticidad de la expresión de la voluntad y consentimiento de los interesados"}, {"pregunta": "18.      El Título I de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común:", "opciones": ["no tiene capítulos", "tiene un capítulo", "tiene dos capítulos", "tiene tres capítulos"], "correcta": "tiene dos capítulos"}, {"pregunta": "19.      El Título I de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común se denomina:", "opciones": ["De los interesados en el procedimiento", "De la actividad de las Administraciones Públicas", "Disposiciones generales", "De los actos administrativos"], "correcta": "De los interesados en el procedimiento"}, {"pregunta": "20.      El Título I de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común comprende los artículos:", "opciones": ["3 a 12", "5 a 14", "4 a 11", "6 a 13"], "correcta": "3 a 12"}, {"pregunta": "1.      Quienes tienen capacidad de obrar ante las Administraciones Públicas, son titulares, en sus relaciones con ellas, del derecho: (señala la incorrecta)", "opciones": ["a utilizar las lenguas oficiales en el territorio de su Comunidad Autónoma", "al acceso a la información pública, archivos y registros", "a ser tratados con respeto y deferencia por las autoridades y empleados públicos", "a no ser asistidos en el uso de medios electrónicos en sus relaciones con las Administraciones Públicas"], "correcta": "a no ser asistidos en el uso de medios electrónicos en sus relaciones con las Administraciones Públicas"}, {"pregunta": "2.      Quienes tienen capacidad de obrar ante las Administraciones Públicas, son titulares, en sus relaciones con ellas, del derecho: (señala la incorrecta)", "opciones": ["a exigir las responsabilidades de las Administraciones Públicas y autoridades, cuando así corresponda legalmente", "a la obtención y utilización de los medios de identificación y firma electrónica contemplados en esta Ley", "a la protección de datos de carácter personal, excepto la seguridad y confidencialidad de los datos que figuren en los ficheros, sistemas y aplicaciones de las Administraciones Públicas", "cualesquiera que les reconozcan la Constitución y las leyes"], "correcta": "a la protección de datos de carácter personal, excepto la seguridad y confidencialidad de los datos que figuren en los ficheros, sistemas y aplicaciones de las Administraciones Públicas"}, {"pregunta": "3.      Las personas físicas podrán elegir en todo momento si se comunican con las Administraciones Públicas para el ejercicio de sus derechos y obligaciones a través de medios electrónicos o no:", "opciones": ["salvo que estén obligadas a relacionarse a través de medios electrón "}, {"pregunta": "1.      Respecto a la práctica de las notificaciones a través de medios electrónicos, los interesados podrán acceder a las notificaciones desde:", "opciones": ["el Punto de Acceso General electrónico de la Administración, que funcionará como un portal de acceso", "la página inicial de la Web de la Administración electrónica, que funcionará como un portal de acceso", "la oficina de la Administración virtual, que funcionará como un portal de acceso", "el Portal de Aplicaciones Informáticas, que funcionará como un portal de acceso"], "correcta": "el Punto de Acceso General electrónico de la Administración, que funcionará como un portal de acceso"}, {"pregunta": "2.      La notificación se hará por medio de un anuncio publicado en el Boletín Oficial del Estado cuando:", "opciones": ["los interesados en un procedimiento sean desconocidos", "se ignore el lugar de la notificación", "intentada la notificación no se hubiese podido practicar", "todas son correctas"], "correcta": "todas son correctas"}, {"pregunta": "3.      Respecto a la pregunta anterior, previamente y con carácter facultativo, las Administraciones podrán publicar un anuncio en:", "opciones": ["el boletín oficial de la Comunidad Autónoma o de la Provincia", "el tablón de edictos del Ayuntamiento del último domicilio del interesado", "el tablón de edictos del Consulado o Sección Consular de la Embajada correspondiente", "todas son correctas"], "correcta": "todas son correctas"}, {"pregunta": "4.      Los actos administrativos serán objeto de publicación cuando (señala la incorrecta):", "opciones": ["así lo establezcan las normas reguladoras de cada procedimiento o lo aconsejen razones de interés público apreciadas por el órgano competente", "el acto tenga por destinatario a una pluralidad indeterminada de personas", "la Administración estime que la notificación efectuada a un solo interesado es insuficiente para garantizar la notificación a todos, no siendo necesaria en este caso la notificación individualizada", "se trate de actos integrantes de un procedimiento selectivo o de concurrencia competitiva de cualquier tipo"], "correcta": "la Administración estime que la notificación efectuada a un solo interesado es insuficiente para garantizar la notificación a todos, no siendo necesaria en este caso la notificación individualizada"}, {"pregunta": "5.      Respecto a la publicación no es correcto:", "opciones": ["la publicación de un acto deberá contener los mismos elementos que se exigen respecto de las notificaciones", "en los supuestos de publicaciones de actos que contengan elementos comunes, podrán publicarse de forma conjunta los aspectos coincidentes, especificándose solamente los aspectos individuales de cada acto", "la publicación de los actos se realizará en el diario oficial que corresponda, según cual sea la Administración de la que proceda el acto a notificar", "la publicación de actos y comunicaciones que, por disposición legal o reglamentaria deba practicarse en tablón de anuncios o edictos, se entenderá cumplida por su publicación en dichos tablones de anuncios o edictos"], "correcta": "la publicación de actos y comunicaciones que, por disposición legal o reglamentaria deba practicarse en tablón de anuncios o edictos, se entenderá cumplida por su publicación en dichos tablones de anuncios o edictos"}, {"pregunta": "6.      Se limitará a publicar en el Diario oficial que corresponda una somera indicación del contenido del acto y del lugar donde los interesados podrán comparecer para conocimiento del contenido íntegro del mencionado acto, si el órgano competente apreciase que:", "opciones": ["la notificación por medio de anuncios lesiona derechos o intereses legítimos", "la publicación de un acto lesiona derechos o intereses legítimos", "a y b son correctos", "a y b son incorrectos"], "correcta": "a y b son correctos"}, {"pregunta": "7.      Los actos de las Administraciones Públicas son nulos de pleno derecho en los casos siguientes (señala la incorrecta):", "opciones": ["los que limiten derechos subjetivos o intereses legítimos", "los dictados por órgano manifiestamente incompetente por razón de la materia o del territorio", "los que tengan un contenido imposible", "los que sean constitutivos de infracción penal o se dicten como consecuencia de ésta"], "correcta": "los que limiten derechos subjetivos o intereses legítimos"}, {"pregunta": "8.      Los actos de las Administraciones Públicas son nulos de pleno derecho en los casos siguientes (señala la incorrecta):", "opciones": ["los dictados prescindiendo total y absolutamente del procedimiento legalmente establecido", "los dictados prescindiendo total y absolutamente de las normas que contienen las reglas esenciales para la formación de la voluntad de los órganos colegiados", "los actos expresos o presuntos contrarios al ordenamiento jurídico por los que se adquieren facultades o derechos cuando se carezca de los requisitos esenciales para su adquisición", "cualquiera que se establezca expresamente en una disposición con rango de Ley o reglamentaria"], "correcta": "cualquiera que se establezca expresamente en una disposición con rango de Ley o reglamentaria"}, {"pregunta": "9.      Serán nulas de pleno derecho las disposiciones administrativas (señala la incorrecta):", "opciones": ["que vulneren la Constitución", "que vulneren las leyes u otras disposiciones administrativas de rango superior", "que regulen materias reservadas a la Ley", "que establezcan la retroactividad de disposiciones sancionadoras favorables o no restrictivas de derechos individuales"], "correcta": "que establezcan la retroactividad de disposiciones sancionadoras favorables o no restrictivas de derechos individuales"}, {"pregunta": "10.      Respecto a la anulabilidad:", "opciones": ["son anulables los actos de la Administración que incurran en cualquier infracción del ordenamiento jurídico, salvo la desviación de poder", "el defecto de forma sólo determinará la anulabilidad cua lidado el acto mediante el otorgamiento de la misma por el órgano competente"], "correcta": "si el vicio consistiera en incompetencia no determinante de nulidad, la convalidación podrá realizarse por el órgano competente siempre que no sea superior jerárquico del que dictó el acto viciado"}, {"pregunta": "13.      Cuando los interesados en un procedimiento sean desconocidos, se ignore el lugar de la notificación o bien, intentada ésta, no se hubiese podido practicar, la notificación se hará por medio de:", "opciones": ["un anuncio publicado en el Boletín Oficial del Estado", "un anuncio en el boletín oficial de la Comunidad Autónoma o de la Provincia", "un anuncio en el tablón de edictos del Ayuntamiento del último domicilio del interesado", "un anuncio en un periódico de difusión nacional"], "correcta": "un anuncio publicado en el Boletín Oficial del Estado"}, {"pregunta": "14.      El título III de Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas se denomina:", "opciones": ["De los interesados en el procedimiento", "De la actividad de las Administraciones Públicas", "De los actos administrativos", "De las disposiciones sobre el procedimiento administrativo común"], "correcta": "De los actos administrativos"}, {"pregunta": "15.      El Título III de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas tiene:", "opciones": ["1 capítulo", "2 capítulos", "3 capítulos", "4 capítulos"], "correcta": "3 capítulos"}, {"pregunta": "16.      El Título III de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas comprende los artículos:", "opciones": ["34 a 52", "30 a 47", "28 a 41", "32 a 49"], "correcta": "34 a 52"}, {"pregunta": "1.      Los interesados en un procedimiento administrativo, tienen derecho a (señala la incorrecta):", "opciones": ["conocer, antes del trámite de audiencia, el estado de la tramitación de los uiera que les reconozcan la Constitución, las leyes o los reglamentos"], "correcta": "cualesquiera que les reconozcan la Constitución, las leyes o los reglamentos"}, {"pregunta": "4.      En el caso de procedimientos administrativos de naturaleza sancionadora, los presuntos responsables tendrán derecho a:", "opciones": ["ser notificado de los hechos que se le imputen, de las infracciones que tales hechos puedan constituir y de las sanciones que, en su caso, se les pudieran imponer", "ser notificado de la identidad del instructor, de la autoridad competente para imponer la sanción y de la norma que atribuya tal competencia", "la presunción de no existencia de responsabilidad administrativa mientras no se demuestre lo contrario", "todas son correctas"], "correcta": "todas son correctas"}, {"pregunta": "5.      Respecto a la iniciación del procedimiento no es correcto:", "opciones": ["los procedimientos podrán iniciarse de oficio o a solicitud del interesado", "con anterioridad al inicio del procedimiento, el órgano competente abrirá un período de información o actuaciones previas con el fin de conocer las circunstancias del caso concreto y la conveniencia o no de iniciar el procedimiento", "en el caso de procedimientos de naturaleza sancionadora las actuaciones previas se orientarán a determinar, con la mayor precisión posible, los hechos susceptibles de motivar la incoación del procedimiento, la identificación de la persona o personas que pudieran resultar responsables y las circunstancias relevantes que concurran en unos y otros", "las actuaciones previas serán realizadas por los órganos que tengan atribuidas funciones de investigación, averiguación e inspección en la materia y, en defecto de éstos, por la persona u órgano administrativo que se determine por el órgano competente para la iniciación o resolución del procedimiento"], "correcta": "con anterioridad al inicio del procedimiento, el órgano competente abrirá un período de información o actuaciones previas con el fin de conocer las circunstancias del caso concreto y la conveniencia o no de iniciar el procedimiento"}, {"pregunta": "6.      Podrá adoptar las medidas provisionales que estime oportunas para asegurar la eficacia de la resolución que pudiera recaer:", "opciones": ["antes de iniciar el procedimiento, el órgano administrativo competente para iniciar o instruir, de oficio o a instancia de parte y de forma motivada", "iniciado el procedimiento, el órgano administrativo competente para resolver, de oficio o a instancia de parte y de forma motivada", "antes de iniciar el procedimiento, el órgano administrativo competente para resolver, de oficio o a instancia de parte y de forma motivada", "iniciado el procedimiento, el órgano administrativo competente para iniciar o instruir, de oficio y de forma motivada"], "correcta": "iniciado el procedimiento, el órgano administrativo competente para resolver, de oficio o a instancia de parte y de forma motivada"}, {"pregunta": "7.      En los casos de urgencia inaplazable y para la protección provisional de los intereses implicados, podrá adoptar de forma motivada las medidas provisionales que resulten necesarias y proporcionadas:", "opciones": ["el órgano competente para iniciar o instruir el procedimiento, de oficio, iniciado el procedimiento administrativo", "el órgano competente para resolver el procedimiento, de oficio, antes de la iniciación del procedimiento administrativo", "el órgano competente para iniciar o instruir el procedimiento, de oficio o a instancia de parte, antes de la iniciación del procedimiento administrativo", "el órgano competente para resolver el procedimiento, de oficio o a instancia de parte, iniciado el procedimiento administrativo"], "correcta": "el órgano competente para iniciar o instruir el procedimiento, de oficio o a instancia de parte, antes de la iniciación del procedimiento administrativo"}, {"pregunta": "8.      Las medidas provisionales deberán ser confirmadas, modificadas o levantadas en el acuerdo de iniciación del procedimiento, que deberá efectuarse dentro de los:", "opciones": ["10 días siguientes a su adopción, el cual no podrá ser objeto de recurso", "15 días siguientes a su adopción, el cual podrá ser objeto del recurso que proceda", "15 días siguientes a su adopción, el cual no podrá ser objeto de recurso", "10 días siguientes a su adopción, el cual podrá ser objeto del recurso que proceda"], "correcta": "15 días siguientes a su adopción, el cual podrá ser objeto del recurso que proceda"}, {"pregunta": "9.      Podrán acordarse las siguientes medidas provisionales (señala la incorrecta):", "opciones": ["suspensión definitiva de actividades", "prestación de fianzas", "suspensión temporal de servicios por razones de sanidad, higiene o seguridad", "embargo preventivo de bienes, rentas y cosas fungibles computables en metálico por aplicación de precios ciertos"], "correcta": "suspensión definitiva de actividades"}, {"pregunta": "10.      Podrán acordarse las siguientes medidas provisionales (señala la incorrecta):", "opciones": ["depósito, retención o inmovilización de cosa mueble", "intervención y depósito de ingresos obtenidos mediante una actividad que se considere lícita", "consignación o constitución de depósito de las cantidades que se reclamen", "retención de ingresos a cuenta que deban abonar las Administraciones Públicas"], "correcta": "intervención y depósito de ingresos obtenidos mediante una actividad que se considere lícita"}, {"pregunta": "11.      Respecto a las medidas provisionales:", "opciones": ["no se podrán adoptar si pueden causar perjuicio de difícil o imposible reparación a los interesados o implicar violación de derechos amparados por las leyes", "no podrán ser alzadas o modificadas durante la tramitación del procedimiento en virtud de circunstancias sobrevenidas o que no pudieron ser tenidas en cuenta en el momento de su adopción", "se consolidarán cuando surta efectos la resolución administrativa que ponga fin al procedimiento correspondiente", "todas son correctas"], "correcta": "no se podrán adoptar si pueden causar perjuicio de difícil o imposible reparación a los interesados o implicar violación de derechos amparados por las leyes"}, {"pregunta": "12.      El órgano administrativo que inicie o tramite un procedimiento siempre que sea el mismo órgano quien deba tramitar y resolver el procedimiento:", "opciones": ["cuando se haya iniciado de oficio, podrá disponer, también de oficio, su acumulación a otros con los que guarde identidad sustancial o íntima conexión", "cuando se haya iniciado a instancia de parte, podrá disponer, también a instancia de parte, su acumulación a otros con los que guarde identidad sustancial o íntima conexión", "cualquiera que haya sido la forma de su iniciación, podrá disponer, de oficio, su acumulación a otros con los que guarde identidad sustancial o íntima conexión", "cualquiera que haya sido la forma de su iniciación, podrá disponer, de oficio o a instancia de parte, su acumulación a otros con los que guarde identidad sustancial o íntima conexión"], "correcta": "cualquiera que haya sido la forma de su iniciación, podrá disponer, de oficio o a instancia de parte, su acumulación a otros con los que guarde identidad sustancial o íntima conexión"}, {"pregunta": "13.      Contra el acuerdo de acumulación:", "opciones": ["podrá imponerse recurso de alzada", "podrá imponerse recurso potestativo de reposición", "podrá imponerse recurso extraordinario de revisión", "no procederá recurso alguno"], "correcta": "no procederá recurso alguno"}, {"pregunta": "14.      Los procedimientos se iniciarán de oficio por acuerdo del órgano competente:", "opciones": ["por propia iniciativa o como consecuencia de orden superior", "a petición razonada de otros órganos", "por denuncia", "todas son correctas"], "correcta": "todas son correctas"}, {"pregunta": "15.      Se entiende por inicio del procedimiento a propia iniciativa:", "opciones": ["el acto por el que cualq     let indice = 0;
    let respuestas = {};
    let feedbacks = {};
    let corregidas = {}; // guarda si ya se corrigió esa pregunta

    // Mezclar preguntas
    preguntas.sort(() => Math.random() - 0.5);

    function mostrarPregunta() {
        const p = preguntas[indice];
        const contenedor = document.getElementById("contenedor");
        contenedor.innerHTML = "";

        let div = document.createElement("div");
        div.className = "pregunta";
        div.innerHTML = "<p><b>" + (indice+1) + ". " + p.pregunta + "</b></p>";

        p.opciones.forEach((opcion) => {
        const checked = respuestas[indice] === opcion ? "checked" : "";
        div.innerHTML += `
            <div class="opcion">
            <label>
                <input type="radio" name="preg_${indice}" value="${opcion}" ${checked}
                onchange="respuestas[indice] = this.value; corregidas[indice] = false;">
                ${opcion}
            </label>
            </div>
        `;
        });

        // Mostrar feedback previo si ya fue corregida
        if (feedbacks[indice]) {
        div.innerHTML += feedbacks[indice];
        }

        contenedor.appendChild(div);
    }

    function siguiente() {
        if (!corregidas[indice]) {
        verificarRespuesta();
        corregidas[indice] = true;
        mostrarPregunta();
        } else if (indice < preguntas.length - 1) {
        indice++;
        mostrarPregunta();
        }
    }

    function anterior() {
        if (indice > 0) {
        indice--;
        mostrarPregunta();
        }
    }

    function verificarRespuesta() {
        const p = preguntas[indice];
        const respuesta = respuestas[indice];
        if (!respuesta) return;

        if (respuesta === p.correcta) {
        feedbacks[indice] = `<div class="feedback correcto">✅ Correcto</div>`;
        } else {
        feedbacks[indice] = `<div class="feedback incorrecto">❌ Incorrecto. La respuesta correcta es: <b>${p.correcta}</b></div>`;
        }
    }

    function corregir() {
        let correctas = 0;
        let respondidas = 0;
        preguntas.forEach((p, idx) => {
        if (respuestas[idx]) {
            respondidas++;
            if (respuestas[idx] === p.correcta) {
            correctas++;
            }
        }
        });

        document.getElementById("score").innerText =
        "Has acertado " + correctas + " de " + respondidas + " preguntas respondidas.";
    }

    // Mostrar la primera pregunta
    mostrarPregunta();
    </script>

</body>
</html>
